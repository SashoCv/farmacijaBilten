; Supervisor programs for the Macedonian Pharmaceutical Bulletin.
; Install as /etc/supervisor/conf.d/bulletin.conf, then
; `supervisorctl reread && supervisorctl update`.

; Server-side rendering (Node 22). Pages still render in the browser if this
; process is down, but crawlers and first paint rely on it.
[program:bulletin-ssr]
command=/usr/bin/php /var/www/bulletin/artisan inertia:start-ssr
directory=/var/www/bulletin
user=www-data
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/var/www/bulletin/storage/logs/ssr.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
redirect_stderr=true

; Queue worker: sends the submission e-mails (editors' notice, author receipt).
; Retries a failed e-mail 3 times, a minute apart; restarts hourly to pick up
; memory and code changes (deploy.sh also runs `php artisan queue:restart`).
[program:bulletin-queue]
command=/usr/bin/php /var/www/bulletin/artisan queue:work database --queue=default --sleep=3 --tries=3 --backoff=60 --max-time=3600
directory=/var/www/bulletin
user=www-data
numprocs=1
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=120
stopasgroup=true
killasgroup=true
stdout_logfile=/var/www/bulletin/storage/logs/queue.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
redirect_stderr=true
