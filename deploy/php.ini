; PHP settings for the Macedonian Pharmaceutical Bulletin (PHP-FPM).
; Install as /etc/php/8.3/fpm/conf.d/99-bulletin.ini (and cli/conf.d for the
; queue worker), then `systemctl reload php8.3-fpm`.

; Manuscript uploads: the form allows 20 MB per file plus small author forms.
upload_max_filesize = 21M
post_max_size = 24M
max_file_uploads = 10

memory_limit = 256M
max_execution_time = 60

; Do not advertise the PHP version.
expose_php = Off

; Never show errors to readers (Laravel logs them to storage/logs).
display_errors = Off
log_errors = On

; OPcache. validate_timestamps = 0 means PHP never re-reads changed files:
; deploy/deploy.sh reloads PHP-FPM after each deployment.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1

realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Sessions are Laravel's (file driver in storage/framework/sessions).
session.use_strict_mode = 1
