# nginx site for the Macedonian Pharmaceutical Bulletin.
# Install: /etc/nginx/sites-available/bulletin, symlink into sites-enabled,
# `nginx -t && systemctl reload nginx`. Paths assume the app lives in
# /var/www/bulletin and PHP-FPM 8.3 listens on its default socket; adjust both.
# TLS certificates: `certbot --nginx -d bulletin.mfd.org.mk`.

server {
    listen 80;
    listen [::]:80;
    server_name bulletin.mfd.org.mk;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://bulletin.mfd.org.mk$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bulletin.mfd.org.mk;

    root /var/www/bulletin/public;
    index index.php;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/bulletin.mfd.org.mk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bulletin.mfd.org.mk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # Manuscript uploads: PHP accepts up to post_max_size = 24M (deploy/php.ini)
    # and answers larger posts with a branded "file too large" message. nginx's
    # limit sits a little higher so that message, not nginx's bare 413, is what
    # authors see for files between 24 and 32 MB.
    client_max_body_size 32m;

    server_tokens off;

    # Same headers as App\Http\Middleware\SecurityHeaders, for the files nginx
    # serves itself (Laravel's responses already carry them).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml application/atom+xml application/rss+xml image/svg+xml;

    # Brotli, when the ngx_brotli module is installed (libnginx-mod-http-brotli-*):
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/plain text/css text/xml application/javascript application/json
    #              application/xml application/atom+xml image/svg+xml;

    # The public/volumes, downloads, media and storage folders are symlinks into
    # storage/ (created by `php artisan storage:link`).
    disable_symlinks off;

    # Built assets carry a content hash in their file names: cache forever.
    location /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # Issue and article PDFs, author forms, images mirrored from the old site.
    # Unknown files fall through to Laravel (legacy redirects, branded 404).
    location ~ ^/(volumes|downloads|media)/ {
        sendfile on;
        tcp_nopush on;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; expires 7d; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Never serve dotfiles (.env, .git) — except the ACME challenge folder.
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Old trailing-slash addresses: answered by nginx for GET/HEAD, saving a
    # PHP request (LegacyPathNormalizer does the same inside the app).
    if ($request_method ~ ^(GET|HEAD)$) {
        rewrite ^/(.+)/$ /$1 permanent;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # The front controller. Old WordPress addresses ("/index.php/<page>") also
    # land here and are redirected by the app.
    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Any other .php file is not part of the app.
    location ~ \.php$ {
        return 404;
    }
}
